[package]
name = "walgit-tray"
version = "0.1.0"
edition = "2021"
description = "walgit 服务托盘(macOS / Windows / Linux)"

[dependencies]
tray-icon = "0.14"
winit = "0.30"

[profile.release]
opt-level = "z"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 单实例命名互斥(仅 Windows 用;版本对齐 tray-icon 传递依赖,不引入新树)。
# Win32_Security 是 CreateMutexW 声明的 cfg 要求——没有它,今天能编译全靠
# winit 传递启用该 feature,winit 一裁剪就断编。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

# 独立 crate:不加入 walgit workspace(根 Cargo.toml),自建 target/lock。
[workspace]
