name: Release

# Tag v* to publish: builds native binaries on linux and windows, generates
# a changelog from Conventional Commits since the previous tag, and attaches
# everything to a GitHub Release. Versioning is semantic; the v0.1 milestone
# is the first target (AGENTS.md §6.4).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc (and the tray's GTK dev libs on linux)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install protoc -y --no-progress; else sudo apt-get update && sudo apt-get install -y protobuf-compiler libgtk-3-dev libayatana-appindicator3-dev libxdo-dev; fi
        shell: bash
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup show && cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          # tray-rs is its own workspace (own Cargo.lock) but its build lands in
          # the root target/ (repo .cargo/config.toml target-dir, cwd-based
          # discovery) — key the cache on both locks or the tray deps rebuild cold.
          workspaces: |
            .
            deploy/tray/tray-rs -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the SPA and the SDK (embedded into the binary)
        run: just web-build
        shell: bash
      - name: Build release binary
        run: cargo build --release --bin walgit --bin walgit-server
      # --target-dir pins the tray exe into the root target/ regardless of how
      # cargo resolves the nested workspace's own [workspace]/.cargo config —
      # the same dir the upload globs and installer.iss expect.
      - name: Build the tray app
        run: cargo build --release --target-dir target --manifest-path deploy/tray/tray-rs/Cargo.toml
      # One installer per platform (issue #108): the .deb is the only linux release
      # artefact, the Inno Setup exe the only windows one; raw binaries are not
      # published. The macOS DMG is built outside CI (deploy/tray/macos/build-dmg.sh)
      # and uploaded to the release.
      - name: Assemble the linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          deploy/linux/build-deb.sh target/release "$tag"
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # ISCC is preinstalled on windows runners; provision it if a future
          # image drops it. Version from the tag (v0.1.0 → 0.1.0).
          if ! command -v ISCC.exe && [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          iscc="$(command -v ISCC.exe || echo '/c/Program Files (x86)/Inno Setup 6/ISCC.exe')"
          tag="${GITHUB_REF#refs/tags/}"
          "$iscc" "-DMyAppVersion=${tag#v}" deploy/windows/installer.iss
      - name: Upload the .deb (linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: walgit-linux-deb
          path: walgit_*.deb
      # The installer rides a SEPARATE artifact: upload-artifact roots an artifact
      # at the least-common-ancestor of its paths, so mixing target/release with
      # deploy/windows/Output would re-root at the workspace root and hand
      # `gh release create artifacts/*` directories instead of files.
      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: walgit-windows-installer
          path: deploy/windows/Output/walgit-setup-*.exe

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          # The tag being released is excluded: descending version sort can put
          # the current tag (or a pre-release like v0.2.1-rc1, which sorts above
          # its release) on the line `sed -n '2p'` would otherwise pick, making
          # the range empty or start at a pre-release.
          prev=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF#refs/tags/}$" | sed -n '1p')
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          git log --pretty=format:'%s' "$range" | grep -E '^(feat|fix|docs|refactor|test|perf|chore)(\(|:)' > changelog.txt || true
          echo "generated from ${range:-HEAD}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          body="$(cat changelog.txt 2>/dev/null || echo '')"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-cut of an existing release (a re-pushed tag rebuilds packaging):
            # attach the fresh artefacts, leave the body untouched.
            gh release upload "$tag" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "$body"
          fi
