name: Release

# Tag v* to publish: builds native binaries on linux and windows, generates
# a changelog from Conventional Commits since the previous tag, and attaches
# everything to a GitHub Release. Versioning is semantic; the v0.1 milestone
# is the first target (AGENTS.md §6.4).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: walgit-linux-x86_64
          - os: windows-latest
            artifact: walgit-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install protoc -y --no-progress; else sudo apt-get update && sudo apt-get install -y protobuf-compiler; fi
        shell: bash
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup show && cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the SPA and the SDK (embedded into the binary)
        run: just web-build
        shell: bash
      - name: Build release binary
        run: cargo build --release --bin walgit --bin walgit-server
      - name: Build the tray app (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev && cargo build --release --manifest-path deploy/tray/tray-rs/Cargo.toml
      - name: Build the tray app (windows)
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path deploy/tray/tray-rs/Cargo.toml
      - name: Build the Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # ISCC is preinstalled on windows runners (PATH via choco shim); the
          # absolute path is the fallback. Version from the tag (v0.1.0 → 0.1.0).
          iscc="$(command -v ISCC.exe || echo '/c/Program Files (x86)/Inno Setup 6/ISCC.exe')"
          tag="${GITHUB_REF#refs/tags/}"
          "$iscc" "-DMyAppVersion=${tag#v}" deploy/windows/installer.iss
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/release/walgit${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/walgit-server${{ runner.os == 'Windows' && '.exe' || '' }}
            target/release/walgit-tray${{ runner.os == 'Windows' && '.exe' || '' }}
            ${{ runner.os == 'Windows' && 'deploy/windows/Output/walgit-setup-*.exe' || '' }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          # The tag being released is excluded: descending version sort can put
          # the current tag (or a pre-release like v0.2.1-rc1, which sorts above
          # its release) on the line `sed -n '2p'` would otherwise pick, making
          # the range empty or start at a pre-release.
          prev=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF#refs/tags/}$" | sed -n '1p')
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          git log --pretty=format:'%s' "$range" | grep -E '^(feat|fix|docs|refactor|test|perf|chore)(\(|:)' > changelog.txt || true
          echo "generated from ${range:-HEAD}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          body="$(cat changelog.txt 2>/dev/null || echo '')"
          gh release create "$tag" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "$body"
