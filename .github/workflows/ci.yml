name: CI

# The repository had no build/test workflow: only pages.yml (a site deploy). A workspace that did
# not compile reached main because nothing ran cargo on push. This runs `just ci` — the same
# tiers AGENTS.md documents (warnings, clippy, test, e2e) — so CI and a contributor's laptop cannot drift.
# The tier definitions live in the justfile, never duplicated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Upstream set cancel-in-progress for the PR-update flow; in this fork's
  # maintenance mode runs are dispatched manually per commit, and cancelling
  # the in-flight run repeatedly killed the ~40 min windows leg before it
  # could report (its result is the scarce signal here). Runs may pile up on
  # this branch; dispatch deliberately.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: warnings + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prost-build does not vendor protoc; without it the proto crate fails with NotFound.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # No toolchain version here on purpose: rust-toolchain.toml pins it (and its components).
      # `rustup show` installs exactly that, so the pin has one home.
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Required, not cosmetic: build.rs only writes a placeholder index.html, and api_v1's
      # v1_surface_and_browser_lane asserts /repos.js and /repos.mjs are served 200. Also runs
      # oxlint --deny-warnings and tsc --noEmit, so the web gate is covered here too.
      - name: Build the SPA and the SDK
        run: just web-build

      - run: just warnings
      - run: just test
      # Rerun once on failure: sim has known-flaky cases (~1 in 7 base_rebuild,
      # AGENTS.md §5); a second failure is a regression.
      - name: Simulation suite
        run: |
          just sim || { echo "sim failed once (possibly known-flaky); rerunning"; sleep 5; just sim; }

  # Known-red until the debt lands (issue #1, ~1300 pre-existing pedantic
  # hits): the gate fails by design, so it is a separate job with
  # continue-on-error — never a merge blocker, always visible. A PR must keep
  # its increment at zero (template field); a red here with new warnings is a
  # regression regardless of the job's conclusion.
  clippy-known-red:
    name: clippy (known-red debt)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just clippy

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install the pinned Rust toolchain
        run: rustup show && cargo --version && git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
      # Rerun once on failure: reads_after_an_acknowledged_push is a known
      # flake (AGENTS.md §5 / issue #4); a second failure is a regression.
      - name: Smart-HTTP end-to-end
        run: |
          just e2e || { echo "e2e failed once (possibly known-flaky); rerunning"; sleep 5; just e2e; }

  # Reachability for every cfg(windows) branch (issue #16): this leg compiles all
  # targets and runs the fast hermetic tier on a real Windows host. Plain cargo +
  # pnpm, not `just`: the recipes are bash-first and this job exists exactly so
  # platform seams stop drifting unnoticed. Clippy joins once its gate is green
  # workspace-wide (it currently trips pre-existing pedantic hits independent of OS).
  windows:
    name: windows fast tier
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: choco install protoc -y --no-progress
      - shell: pwsh
        run: rustup show; cargo --version; git --version
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the SPA and the SDK
        run: just web-build
        shell: bash
      - name: Compile every target (lib/bins/tests)
        run: cargo check --workspace --all-targets
      - name: Fast hermetic tier
        # bash, not the default pwsh: on Windows pwsh keeps going after a failing
        # native command and the step's exit code is the LAST line's — a broken
        # first tier would read green. bash stops at the first non-zero.
        shell: bash
        run: |
          set -e
          cargo test --workspace --lib --bins
          cargo test -p walgit-store -p walgit-git -p walgit-wal -p walgit-bundle --tests
          cargo test -p walgit-server --test web_api --test web_ui --test api_v1 --test static_http --test maintain --test routing_prefix --test lfs_upstream --test drain
      - name: Simulation suite
        # Fault-injected cluster (WALGIT_SIM_SEEDS, default 2). Known flaky:
        # base_rebuild_resumes_after_a_kill_between_any_two_phases ~1 in 7
        # (shared TEST_ABORT_AFTER; AGENTS.md) — rerun once, not skip.
        shell: bash
        run: |
          cargo test -p walgit-server --test sim || { echo "sim failed once (possibly known-flaky); rerunning"; sleep 5; cargo test -p walgit-server --test sim; }
      - name: Smart-HTTP end-to-end
        # Real git against the server; the SPA build above is its only
        # precondition (api_v1 asserts the built assets are served).
        shell: bash
        run: |
          cargo test -p walgit-server --test e2e || { echo "e2e failed once (possibly known-flaky); rerunning"; sleep 5; cargo test -p walgit-server --test e2e; }
